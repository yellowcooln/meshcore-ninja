# Source: https://github.com/yellowcooln/openHop_Repeater (verified 2026-08-13)
name: openHop Repeater
also_known_as:
  - pyMC Repeater
kind: gateway
status: active
maturity: beta
description: >-
  Lightweight Python MeshCore repeater daemon built on openhop_core for
  Pi-class and embedded Linux hardware. Supports direct SX1262 SPI radios,
  CH341 USB-to-SPI adapters, pyMC TCP/USB modems and KISS serial modems.
  Forwards LoRa packets, exposes a web dashboard, and provides configuration
  tools for radio setup, policy management, monitoring and integrations.
  Server for [[software:pymc-console|pyMC Console]].

image: logo.png
screenshots:
  - file: dashboard.png
    caption: Repeater status and packet monitoring dashboard
  - file: statistics.png
    caption: Repeater traffic and performance statistics

maintainers:
  - name: Treehouse-00
  - name: openHop

repository: https://github.com/yellowcooln/openHop_Repeater
license: MIT

languages:
  - python
  - shell

platforms:
  - linux
  - docker
  - proxmox
  - raspberry-pi
interfaces:
  - web
  - headless
connections:
  - serial
  - usb
  - http
node_roles:
  - repeater
capabilities:
  - remote-administration
  - monitoring
  - telemetry
  - packet-analysis

install:
  - type: bare-metal
    package: Python / systemd
    url: https://github.com/yellowcooln/openHop_Repeater#installation
    command: sudo bash ./manage.sh install
  - type: docker-compose
    url: https://github.com/yellowcooln/openHop_Repeater#docker-compose
    command: docker compose up -d --force-recreate --build
  - type: proxmox-lxc
    url: https://github.com/yellowcooln/openHop_Repeater#proxmox-lxc-installation
  - type: source
    url: https://github.com/yellowcooln/openHop_Repeater

