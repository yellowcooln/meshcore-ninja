name: openHop Console
also_known_as:
  - pyMC Console
kind: monitoring
status: active
maturity: beta
description: >-
  Web dashboard for [[software:pymc-repeater|openHop Repeater]] with live packet inspection, topology and
  path analysis, RF statistics, terrain mapping, link-quality radar, system
  monitoring and an interactive repeater terminal.

image: openhop-logo.svg
screenshots:
  - file: topology.png
    caption: Deep topology analysis and terrain mapping
  - file: link-quality.png
    caption: Directional link-quality radar
  - file: statistics.png
    caption: RF and airtime statistics
  - file: terminal.png
    caption: Repeater terminal, logs and themes

maintainers:
  - name: openhop-dev
    url: https://github.com/openhop-dev

# Source: https://github.com/openhop-dev/openHop_RepeaterUI (verified 2026-08-13)
repository: https://github.com/openhop-dev/openHop_RepeaterUI
documentation: https://openhop.dev/
license: MIT

languages:
  - javascript
  - typescript
  - shell

platforms:
  - linux
  - raspberry-pi
  - web
interfaces:
  - web
connections:
  - http
  - websocket
node_roles:
  - repeater
capabilities:
  - node-configuration
  - remote-administration
  - monitoring
  - telemetry
  - packet-analysis
  - mapping

install:
  - type: manual
    url: https://github.com/openhop-dev/openHop_RepeaterUI#install-the-console
    command: sudo bash manage.sh install
  - type: source
    url: https://github.com/openhop-dev/openHop_RepeaterUI

verification:
  sourceAvailable: true
  releasesAvailable: false
  signedReleases: false
  ciBuilds: true
  hasDocumentation: true
  lastChecked: 2026-07-03
  notes:
    - "Requires an existing openHop Repeater installation and replaces only its web dashboard assets."
    - "Repeater service lifecycle and radio configuration remain owned by openHop Repeater."
    - "Formerly pyMC Console; the current openHop project repository is openHop_RepeaterUI."

tags:
  - repeater
  - topology
  - rf-analysis
  - raspberry-pi
  - dashboard

last_reviewed: 2026-07-03
